version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fxaeon-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fxaeon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fxaeon_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-fxaeon}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fxaeon"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: fxaeon-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  bot:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: fxaeon-bot
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fxaeon}:${POSTGRES_PASSWORD:-fxaeon_secure_pass}@postgres:5432/${POSTGRES_DB:-fxaeon}?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 8080
    ports:
      - "8080:8080"
    command: sh -c "pnpm --filter @fxaeon/db prisma migrate deploy && node apps/bot/dist/main.js"

  mini-app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: fxaeon-mini-app
    restart: always
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    command: node apps/mini-app/serve.mjs

volumes:
  pgdata:
