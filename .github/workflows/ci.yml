name: Client CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Scope, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm verify` includes the built-artifact Playwright gate. Install the
      # pinned browser here as well as in the focused E2E workflow so the CI
      # badge reflects the same release gate instead of failing at launch.
      - run: pnpm --dir apps/mini-app exec playwright install --with-deps chromium
      - name: Run complete repository verification
        run: pnpm verify
        env:
          NEXT_PUBLIC_ALCHEMY_ETHEREUM_RPC_URL: https://eth-mainnet.g.alchemy.com/v2/ci-placeholder
          NEXT_PUBLIC_ALCHEMY_BASE_RPC_URL: https://base-mainnet.g.alchemy.com/v2/ci-placeholder
          NEXT_PUBLIC_TELEGRAM_APP_URL: https://t.me/FxAeonBot/app
