name: Mini App E2E

on:
  push:
    branches: [main]
    paths:
      - 'apps/mini-app/**'
      - 'patches/**'
      - 'fx-scope.lock.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mini-app/**'
      - 'patches/**'
      - 'fx-scope.lock.json'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/mini-app exec playwright install --with-deps chromium
      - name: Build browser-only static export once
        run: pnpm build
        env:
          NEXT_PUBLIC_ALCHEMY_ETHEREUM_RPC_URL: https://eth-mainnet.g.alchemy.com/v2/e2e-placeholder
          NEXT_PUBLIC_ALCHEMY_BASE_RPC_URL: https://base-mainnet.g.alchemy.com/v2/e2e-placeholder
          NEXT_PUBLIC_TELEGRAM_APP_URL: https://t.me/FxAeonBot/app
      - name: Run browser and Telegram viewport tests
        run: pnpm test:e2e
        env:
          # The static export above is reused. This prevents Playwright's
          # webServer from spending the whole test startup budget rebuilding
          # Next on every CI run.
          E2E_BUILD: '0'
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/mini-app/playwright-report
          retention-days: 7
