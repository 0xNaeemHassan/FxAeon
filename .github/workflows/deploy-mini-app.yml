name: Deploy static Mini App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fxaeon-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Cloudflare Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser verification runtime
        run: pnpm --dir apps/mini-app exec playwright install --with-deps chromium
      - name: Validate public build configuration
        env:
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
          NEXT_PUBLIC_ALCHEMY_ETHEREUM_RPC_URL: ${{ secrets.NEXT_PUBLIC_ALCHEMY_ETHEREUM_RPC_URL }}
          NEXT_PUBLIC_ALCHEMY_BASE_RPC_URL: ${{ secrets.NEXT_PUBLIC_ALCHEMY_BASE_RPC_URL }}
          NEXT_PUBLIC_ALCHEMY2_ETHEREUM_RPC_URL: ${{ secrets.NEXT_PUBLIC_ALCHEMY2_ETHEREUM_RPC_URL }}
          NEXT_PUBLIC_ALCHEMY2_BASE_RPC_URL: ${{ secrets.NEXT_PUBLIC_ALCHEMY2_BASE_RPC_URL }}
          NEXT_PUBLIC_INFURA_ETHEREUM_RPC_URL: ${{ secrets.NEXT_PUBLIC_INFURA_ETHEREUM_RPC_URL }}
          NEXT_PUBLIC_INFURA_BASE_RPC_URL: ${{ secrets.NEXT_PUBLIC_INFURA_BASE_RPC_URL }}
          NEXT_PUBLIC_ALCHEMY_DATA_API_KEY: ${{ secrets.NEXT_PUBLIC_ALCHEMY_DATA_API_KEY }}
          NEXT_PUBLIC_TELEGRAM_APP_URL: ${{ vars.NEXT_PUBLIC_TELEGRAM_APP_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: pnpm verify:production-env
      - name: Run complete repository verification
        run: pnpm verify
      - name: Build production deployment artifact
        run: pnpm build
        env:
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
          NEXT_PUBLIC_ALCHEMY_ETHEREUM_RPC_URL: ${{ secrets.NEXT_PUBLIC_ALCHEMY_ETHEREUM_RPC_URL }}
          NEXT_PUBLIC_ALCHEMY_BASE_RPC_URL: ${{ secrets.NEXT_PUBLIC_ALCHEMY_BASE_RPC_URL }}
          NEXT_PUBLIC_ALCHEMY2_ETHEREUM_RPC_URL: ${{ secrets.NEXT_PUBLIC_ALCHEMY2_ETHEREUM_RPC_URL }}
          NEXT_PUBLIC_ALCHEMY2_BASE_RPC_URL: ${{ secrets.NEXT_PUBLIC_ALCHEMY2_BASE_RPC_URL }}
          NEXT_PUBLIC_INFURA_ETHEREUM_RPC_URL: ${{ secrets.NEXT_PUBLIC_INFURA_ETHEREUM_RPC_URL }}
          NEXT_PUBLIC_INFURA_BASE_RPC_URL: ${{ secrets.NEXT_PUBLIC_INFURA_BASE_RPC_URL }}
          NEXT_PUBLIC_ALCHEMY_DATA_API_KEY: ${{ secrets.NEXT_PUBLIC_ALCHEMY_DATA_API_KEY }}
          NEXT_PUBLIC_TELEGRAM_APP_URL: ${{ vars.NEXT_PUBLIC_TELEGRAM_APP_URL }}
      - name: Check production artifact
        env:
          NEXT_PUBLIC_ALCHEMY_ETHEREUM_RPC_URL: ${{ secrets.NEXT_PUBLIC_ALCHEMY_ETHEREUM_RPC_URL }}
          NEXT_PUBLIC_ALCHEMY_BASE_RPC_URL: ${{ secrets.NEXT_PUBLIC_ALCHEMY_BASE_RPC_URL }}
          NEXT_PUBLIC_ALCHEMY2_ETHEREUM_RPC_URL: ${{ secrets.NEXT_PUBLIC_ALCHEMY2_ETHEREUM_RPC_URL }}
          NEXT_PUBLIC_ALCHEMY2_BASE_RPC_URL: ${{ secrets.NEXT_PUBLIC_ALCHEMY2_BASE_RPC_URL }}
          NEXT_PUBLIC_INFURA_ETHEREUM_RPC_URL: ${{ secrets.NEXT_PUBLIC_INFURA_ETHEREUM_RPC_URL }}
          NEXT_PUBLIC_INFURA_BASE_RPC_URL: ${{ secrets.NEXT_PUBLIC_INFURA_BASE_RPC_URL }}
        run: |
          node scripts/verify_frontend_secrets.mjs --built
          node scripts/verify_built_rpc_config.mjs
          pnpm check:bundle
      - name: Stamp production revision
        run: node scripts/release_revision.mjs write "$GITHUB_SHA"
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Sync production Pages gas-oracle secret
        id: gas_secret
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [[ -z "${ETHERSCAN_API_KEY:-}" ]]; then
            echo "::warning::ETHERSCAN_API_KEY is not configured; deploying with the RPC gas estimate fallback."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s' "$ETHERSCAN_API_KEY" | pnpm exec wrangler pages secret put ETHERSCAN_API_KEY --project-name=fxaeon --env=production; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Pages secret sync was not authorized; deploying with the RPC gas estimate fallback."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy verified production artifact
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          pnpm exec wrangler pages deploy apps/mini-app/dist --project-name=fxaeon --branch=main --commit-hash="$GITHUB_SHA" --commit-message="Verified production artifact $GITHUB_SHA"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Verify deployed revision
        run: node scripts/release_revision.mjs verify "$GITHUB_SHA"
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Check live gas-oracle binding
        id: gas_oracle
        run: node scripts/check_live_gas_oracle.mjs
        env:
          LIVE_GAS_ORACLE_URL: https://fxaeon.com/api/gas
      - name: Verify live gas oracle
        if: steps.gas_secret.outputs.configured == 'true'
        run: node scripts/check_live_gas_oracle.mjs --require-configured
        env:
          LIVE_GAS_ORACLE_URL: https://fxaeon.com/api/gas
      - name: Verify live wallet configuration
        run: node scripts/verify_live_public_config.mjs
        env:
          EXPECTED_PUBLIC_PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
          GITHUB_SHA: ${{ github.sha }}
          LIVE_APP_URL: https://fxaeon.com
      - name: Sync Telegram bot metadata and menu
        run: node scripts/sync_telegram_bot.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEB_APP_URL: https://fxaeon.com/
