name: lighthouse-ci

on:
  pull_request:
    paths:
      - "apps/mini-app/**"

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build mini-app (static export)
        run: pnpm build
        env:
          NEXT_PUBLIC_ALCHEMY_ETHEREUM_RPC_URL: https://eth-mainnet.g.alchemy.com/v2/ci-placeholder
          NEXT_PUBLIC_ALCHEMY_BASE_RPC_URL: https://base-mainnet.g.alchemy.com/v2/ci-placeholder
          NEXT_PUBLIC_TELEGRAM_APP_URL: https://t.me/FxAeonBot/app
      - name: Check static bundle budget
        run: pnpm check:bundle
      - name: Lighthouse CI
        working-directory: apps/mini-app
        run: pnpm exec lhci autorun --config=lighthouserc.json
