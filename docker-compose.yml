# LOCAL/DEV ONLY — production runs on Render (render.yaml). (W-14)
services:
  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      # .env.example uses localhost for host development; inside Compose the
      # Redis service is reached by its DNS name instead.
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379}
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      # Container liveness must not restart the process merely because an
      # external dependency is degraded. Deep readiness remains available at
      # /api/v1/health for operators and smoke tests.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mini-app:
    build:
      context: .
      dockerfile: apps/mini-app/Dockerfile
      args:
        # Browser requests go through the Nginx gateway below; the bot is not
        # published directly on host port 8080.
        NEXT_PUBLIC_BOT_API_URL: ${NEXT_PUBLIC_BOT_API_URL:-http://localhost}
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-FxAeonBot}
        NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID:-}
        NEXT_PUBLIC_PRIVY_SIGNER_ID: ${NEXT_PUBLIC_PRIVY_SIGNER_ID:-}
    # This is a static Nginx image. Do not inject the bot's runtime `.env`
    # (database, Telegram, Privy server, and signing secrets) into it.
    environment:
      - NODE_ENV=production
    ports:
      - "3001:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    command: >
      sh -c "redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - bot
      - mini-app
    restart: unless-stopped

volumes:
  redis_data:
