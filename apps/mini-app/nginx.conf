server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Next's static export emits both route.html and route/index.html depending
  # on version/config. This also preserves client-side routes on a hard reload.
  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }

  location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  # Telegram web is an allowed ancestor; object/base injection is denied. The
  # HTTPS/WSS connect allowance is required by Privy's embedded wallet SDK,
  # which selects chain and authentication endpoints at runtime.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self' https://auth.privy.io; frame-ancestors https://web.telegram.org https://*.telegram.org; script-src 'self' 'unsafe-inline' https://telegram.org https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.reown.com; connect-src 'self' https: wss:; frame-src https://auth.privy.io https://*.privy.io https://challenges.cloudflare.com https://verify.walletconnect.com https://verify.walletconnect.org; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
