services:
  - type: web
    name: fxaeon-bot
    runtime: node
    plan: standard
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @fxaeon/db db:generate && pnpm build
    startCommand: node apps/bot/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: 22.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: fxaeon-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: ALCHEMY_RPC_URL
        sync: false

  - type: web
    name: fxaeon-mini-app
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @fxaeon/mini-app build
    staticPublishPath: ./apps/mini-app/dist
    envVars:
      - key: NEXT_PUBLIC_BOT_API_URL
        fromService:
          type: web
          name: fxaeon-bot
          property: host

databases:
  - name: fxaeon-db
    plan: standard
    postgresMajorVersion: "16"
